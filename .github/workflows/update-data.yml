name: Update ranking data

# Refreshes the bundled offline rankings (data/*.json) and the Sleeper player file so the
# fallback data and player lookups stay current through the season.
on:
  schedule:
    - cron: '17 */6 * 8-12,1 *'   # every 6 hours, August through January
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch rankings and Sleeper players
        run: python getFPData.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update ranking data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
